son at a residence on Unity Boulevard after evidence suggested the fire may have been deliberately set. The Los Santos Fire Department's Arson Counter Terrorism Section is leading the investigation.\n\nInvestigators deployed a specialized K-9 unit trained to detect accelerants. According to field reports, the canine detected traces consistent with gasoline inside the damaged building. A used jerrycan believed to have been used to spread fuel was also recovered.\n\n\"All physical evidence at the scene points to one conclusion: this was not an accident, but a planned act,\" said Arson Fire Captain Adam Garpen. Debris samples and the suspected fuel container have been sent for forensic testing to identify potential fingerprints or DNA evidence.\n\nThe department urges anyone who witnessed suspicious activity near Unity Boulevard on the night of the incident to contact authorities through the 9-1-1 emergency hotline. Informant identities will remain confidential."},{"id":"s2","type":"advisory","tag":"Public Safety","division":"Fire Suppression","status":"Active Advisory","title":"Brush fire season: LSFD issues Red Flag guidance for Blueberry and Red County","author":"PIO Lieutenant, LSFD Public Relations","date":"2026-10-09T09:30","image":"","content":"LOS SANTOS – With dry conditions and seasonal winds forecast through the week, the Los Santos Fire Department has issued a Red Flag advisory for Blueberry and Red County.\n\n## What residents should do\n1. Avoid open flames and outdoor burning.\n2. Refrain from using power equipment on dry vegetation.\n3. Maintain at least 30 feet of defensible space around structures.\n\nAny sign of smoke or fire should be reported immediately to 9-1-1. Do not attempt to fight a wildland fire yourself."},{"id":"s3","type":"press","tag":"Public Health","division":"EMS","status":"Community","title":"LSFD EMS opens free CPR and AED training sessions across the city","author":"PIO Captain, LSFD Public Relations","date":"2026-10-08T14:00","image":"","content":"LOS SANTOS – The LSFD Emergency Medical Services Division will host free hands-only CPR and AED training sessions at city fire stations beginning next week.\n\nCertified paramedics will guide participants through:\n- Recognizing cardiac arrest\n- Performing chest compressions\n- Operating automated external defibrillators\n\nNo registration is required and sessions are open to all residents aged 12 and older.\n\n> \"Bystander action in the first minutes saves lives,\" the division said in a statement."},{"id":"s4","type":"incident","tag":"Structure Fire","division":"Fire Suppression","status":"Resolved","title":"Two-alarm structure fire at Davis warehouse contained, no injuries reported","author":"PIO Lieutenant, LSFD Public Relations","date":"2026-10-07T03:45","image":"","content":"DAVIS, Los Santos – Firefighters contained a two-alarm fire at a commercial warehouse in Davis early Wednesday. Crews arrived within minutes and mounted an aggressive interior and exterior attack.\n\nNo civilians or firefighters were injured. The cause is under investigation and the building has been turned over to the property owner."},{"id":"s5","type":"bulletin","tag":"Hazardous Materials","division":"HAZMAT","status":"Closed","title":"HAZMAT team neutralizes chemical leak at Terminal Island facility","author":"PIO Captain, LSFD Public Relations","date":"2026-10-05T18:20","image":"","content":"TERMINAL ISLAND, Los Santos – The LSFD HAZMAT Division responded to a reported chemical leak at an industrial facility. Nearby streets were briefly closed as a precaution.\n\nThe substance was contained and neutralized. Air monitoring showed no ongoing risk to the public, and all roads have reopened."}],"cfg":{"org":"LOS SANTOS FIRE DEPARTMENT","sub":"PUBLIC INFORMATION OFFICE","sections":[{"id":"press","label":"Press Releases","kind":"sec"},{"id":"incident","label":"Incident Reports","kind":"sec"},{"id":"divs","label":"Divisions","kind":"divs"},{"id":"advisory","label":"Safety Advisories","kind":"sec"},{"id":"bulletin","label":"Public Bulletins","kind":"sec"}],"divisions":["Arson Counter Terrorism","EMS","HAZMAT","Fire Suppression"],"banner":{"on":false,"text":"","level":"alert"},"dispatch":{"title":"LSFD LIVE DISPATCH STATUS","active":"3","units":"42","response":"4:12","alert":"Red Flag advisory – Blueberry / Red County","phone":"Emergency: 9-1-1"},"listTitle":"Recent Press Releases","disclaimer":"This release is issued by the Los Santos Fire Department Public Information Office. Information is accurate at the time of publication and may be updated as investigations develop. For emergencies, dial 9-1-1. © 2026 Los Santos City Fire Department – Founded 1886. All rights reserved.","footer":"© 2026 Los Santos City Fire Department – Public Information Office. Founded 1886. In an emergency, call 9-1-1. This portal is the official source of LSFD press information."}}</script>

/* ---------- rich text (list, heading, bold, italic, quote, link) ---------- */
function Inl({s}){
  return s.split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g).map((p,i)=>{
    let m;
    if(m=p.match(/^\*\*([^*]+)\*\*$/))return <strong key={i}>{m[1]}</strong>;
    if(m=p.match(/^\*([^*\s][^*]*)\*$/))return <em key={i}>{m[1]}</em>;
    if(m=p.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/))return <a key={i} href={m[2]} target="_blank" rel="noopener noreferrer" className="text-[#7a0f14] underline">{m[1]}</a>;
    return p;
  });
}
function Rich({text}){
  const out=[];let buf=null;const flush=()=>{if(buf){out.push(buf);buf=null}};
  text.replace(/\r/g,"").split("\n").forEach(l=>{
    let m;
    if(!l.trim()){flush();return}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(!buf||buf.t!=="ol"){flush();buf={t:"ol",i:[]}}buf.i.push(m[1]);return}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(!buf||buf.t!=="ul"){flush();buf={t:"ul",i:[]}}buf.i.push(m[1]);return}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flush();out.push({t:"h",l:m[1].length,i:[m[2]]});return}
    if(m=l.match(/^>\s?(.*)/)){if(!buf||buf.t!=="q"){flush();buf={t:"q",i:[]}}buf.i.push(m[1]);return}
    if(/^-{3,}$/.test(l.trim())){flush();out.push({t:"hr",i:[]});return}
    if(!buf||buf.t!=="p"){flush();buf={t:"p",i:[]}}buf.i.push(l);
  });flush();
  return <>{out.map((b,k)=>{
    if(b.t==="ol")return <ol key={k} className="list-decimal pl-7 mb-4 space-y-1 prose-p">{b.i.map((x,i)=><li key={i}><Inl s={x}/></li>)}</ol>;
    if(b.t==="ul")return <ul key={k} className="list-disc pl-7 mb-4 space-y-1 prose-p">{b.i.map((x,i)=><li key={i}><Inl s={x}/></li>)}</ul>;
    if(b.t==="h")return <h2 key={k} className={"font-bold text-[#0b1426] mt-6 mb-2 "+(b.l===1?"text-3xl":b.l===2?"text-2xl":"text-xl")}><Inl s={b.i[0]}/></h2>;
    if(b.t==="q")return <blockquote key={k} className="border-l-4 border-[#c9a227] pl-4 italic text-slate-700 mb-4 prose-p">{b.i.map((x,i)=><div key={i}><Inl s={x}/></div>)}</blockquote>;
    if(b.t==="hr")return <hr key={k} className="my-5"/>;
    return <p key={k} className="prose-p relative">{b.i.map((x,i)=><React.Fragment key={i}>{i>0&&<br/>}<Inl s={x}/></React.Fragment>)}</p>;
  })}</>;
}

      {fld("Teks alert",cfg.dispatch.alert,v=>dsp("alert",v))}
      {fld("Teks kontak darurat",cfg.dispatch.phone,v=>dsp("phone",v))}
      {fld("Official disclaimer (bawah artikel)",cfg.disclaimer,v=>c("disclaimer",v),4)}
      {fld("Teks footer",cfg.footer,v=>c("footer",v),3)}
      <div className="border rounded p-3 space-y-2">
        <div className="font-bold text-sm">Backup data</div>
        <div className="flex flex-wrap gap-2">
          <button onClick={onExport} className="text-sm border px-3 py-2 rounded flex items-center gap-2"><Icon n="Download" size={14}/>Export backup (.json)</button>
          <label className="text-sm border px-3 py-2 rounded flex items-center gap-2 cursor-pointer"><Icon n="Upload" size={14}/>Import backup<input type="file" accept=".json,application/json" className="hidden" onChange={e=>{const x=e.target.files[0];if(x)onImport(x)}}/></label>
          <button onClick={onReset} className="text-sm border border-red-300 text-red-700 px-3 py-2 rounded flex items-center gap-2"><Icon n="RotateCcw" size={14}/>Reset ke awal</button>
        </div>
      </div>
    </div>}
    <div className="text-xs text-slate-400">Semua perubahan disimpan otomatis.</div>
    </div>
  </div>;
}

function Article({a,cfg,admin,onEdit,onDelete,related,onPick,note}){
  const sec=cfg.sections.find(s=>s.id===a.type);
  const mins=Math.max(1,Math.round(a.content.split(/\s+/).length/200));
  const copy=async()=>{const u=location.href.split("#")[0]+"#"+a.id;try{await navigator.clipboard.writeText(u);note("Link disalin.")}catch(e){note("Salin dari address bar browser.")}};
  return <article className="bg-white rounded shadow-sm border">
    <div className="p-4 md:p-7">
      <div className="flex flex-wrap items-center gap-2 sans text-xs font-bold uppercase tracking-wider">
        {a.pinned&&<span className="bg-amber-500 text-white px-2 py-1 rounded-sm">📌 Pinned</span>}
        {a.draft&&<span className="bg-slate-700 text-white px-2 py-1 rounded-sm">Draft – tidak tampil di publik</span>}
        {(a.tag||sec)&&<span className="bg-[#7a0f14] text-white px-2 py-1 rounded-sm">{a.tag||sec.label}</span>}
        <span className={"text-white px-2 py-1 rounded-sm "+PAL[Math.max(0,cfg.divisions.indexOf(a.division))%PAL.length]}>{a.division}</span>
        {sec&&<span className="text-slate-500">{sec.label}</span>}
      </div>
      <h1 className="text-2xl md:text-4xl font-bold leading-tight mt-3 text-[#0b1426]">{a.title}</h1>
      <div className="sans text-sm text-slate-600 mt-3 flex flex-wrap items-center gap-x-4 gap-y-1">
        {a.author&&<span className="flex items-center gap-1"><Icon n="UserRound" size={14}/>By {a.author}</span>}
        <span className="flex items-center gap-1"><Icon n="Clock" size={14}/>{fmt(a.date)}</span>
        <span className="flex items-center gap-1"><Icon n="BookOpen" size={14}/>{mins} min read</span>
      </div>
      <div className="sans mt-3 flex flex-wrap gap-2 noprint">
        <button onClick={copy} className="text-xs border px-3 py-1.5 rounded flex items-center gap-1"><Icon n="Link" size={12}/>Salin link</button>
        <button onClick={()=>{try{window.print()}catch(e){}}} className="text-xs border px-3 py-1.5 rounded flex items-center gap-1"><Icon n="Printer" size={12}/>Cetak</button>
        {admin&&<><button onClick={()=>onEdit(a)} className="text-xs border border-[#7a0f14] text-[#7a0f14] px-3 py-1.5 rounded flex items-center gap-1"><Icon n="Pencil" size={12}/>Edit</button>
        <button onClick={()=>onDelete(a)} className="text-xs border border-red-300 text-red-700 px-3 py-1.5 rounded flex items-center gap-1"><Icon n="Trash2" size={12}/>Hapus</button></>}
      </div>
    </div>
    {a.image&&<figure>
      <img src={a.image} alt={a.caption||a.title} className="w-full h-auto block"/>
      {a.caption&&<figcaption className="sans text-xs text-slate-500 px-4 md:px-7 py-2 border-b italic">{a.caption}</figcaption>}
    </figure>}
    <div className="p-4 md:p-7 relative overflow-hidden">
      <img src={LOGO} alt="" className="absolute right-4 bottom-4 w-56 opacity-[0.05] pointer-events-none"/>
      <Rich text={a.content}/>
      <div className="sans mt-6 border-l-4 border-[#c9a227] bg-[#f8f5ea] p-4 text-xs text-slate-700 relative">
        <div className="font-bold text-[#0b1426] mb-1 flex items-center gap-1"><Icon n="BadgeCheck" size={14}/>OFFICIAL DISCLAIMER</div>{cfg.disclaimer}
      </div>
    </div>
    {related.length>0&&<div className="sans p-4 md:p-7 pt-0 noprint"><div className="font-bold text-sm text-[#0b1426] mb-2 border-t pt-4">Rilis terkait</div>
      {related.map(r=><button key={r.id} onClick={()=>onPick(r.id)} className="block text-left text-sm text-[#7a0f14] hover:underline mb-1">→ {r.title}</button>)}</div>}
  </article>;
}

function Sidebar({list,cur,onPick,cfg}){
  const [t,setT]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
  const d=cfg.dispatch;
  return <aside className="space-y-5 sans min-w-0">
    <div className="bg-[#0b1426] text-white rounded shadow overflow-hidden">
      <div className="bg-[#7a0f14] px-4 py-2 flex items-center justify-between gap-2 text-xs font-bold tracking-widest">
        <span className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-300 blink shrink-0"></span>{d.title}</span><span>{t.toLocaleTimeString("en-US",{hour12:false})}</span>
      </div>
      <div className="p-4 grid grid-cols-3 gap-2 text-center">
        {[["Active",d.active],["Units Avail.",d.units],["Response",d.response]].map(([k,v])=><div key={k} className="bg-white/5 rounded py-2"><div className="text-xl font-bold text-[#c9a227]">{v}</div><div className="text-[10px] uppercase tracking-wider text-slate-300">{k}</div></div>)}
      </div>
      <div className="px-4 pb-4 text-xs space-y-1 text-slate-200">
        {d.alert&&<div className="flex items-center gap-2"><Icon n="TriangleAlert" size={13} className="text-amber-400 shrink-0"/>{d.alert}</div>}
        {d.phone&&<div className="flex items-center gap-2"><Icon n="Phone" size={13} className="text-[#c9a227] shrink-0"/>{d.phone}</div>}
      </div>
    </div>
    <div className="bg-white rounded shadow-sm border">
      <div className="px-4 py-3 border-b-2 border-[#c9a227] font-bold text-[#0b1426] flex items-center gap-2"><Icon n="Newspaper" size={16}/>{cfg.listTitle}</div>
      {list.length===0&&<div className="p-4 text-sm text-slate-500">Belum ada rilis di bagian ini.</div>}
      {list.map(a=><button key={a.id} onClick={()=>onPick(a.id)} className={"w-full text-left flex gap-3 p-3 border-b last:border-0 hover:bg-slate-50 "+(cur===a.id?"bg-[#fbf3f3] border-l-4 border-l-[#7a0f14]":"")}>
        <Thumb a={a} cls="w-20 h-16 rounded shrink-0"/>
        <div className="min-w-0">
          <div className="text-sm font-semibold leading-snug text-[#0b1426] line-clamp-3">{a.pinned&&"📌 "}{a.draft&&<span className="text-amber-700">[DRAFT] </span>}{a.title}</div>
          <div className="text-[11px] text-slate-500 mt-1">{fmtS(a.date)}</div>
          <span className={"inline-block mt-1 text-[10px] text-white px-1.5 py-0.5 rounded-sm "+PAL[Math.max(0,cfg.divisions.indexOf(a.division))%PAL.length]}>{a.status||a.division}</span>
        </div>
      </button>)}
    </div>
  </aside>;
}

function App(){
  const D0=sget("lsfd_admin")==="1"?readDraft():null;
  const [items,setItems]=useState(()=>D0?D0.items:((EMB&&EMB.items)||seed));
  const [cfg,setCfg]=useState(()=>mergeCfg(D0?D0.cfg:(EMB&&EMB.cfg)));
  const [dirty,setDirty]=useState(!!D0);
  const [cur,setCur]=useState(()=>location.hash.slice(1)||null);
  const [admin,setAdmin]=useState(sget("lsfd_admin")==="1");
  const [login,setLogin]=useState(false);
  const [filter,setFilter]=useState({k:"all",v:""});
  const [view,setView]=useState(sget("lsfd_admin")==="1"?(sget("lsfd_view")||"read"):"read");
  const [form,setForm]=useState(null);
  const [q,setQ]=useState(""),[searching,setSearching]=useState(false);
  const [menu,setMenu]=useState(false);
  const [toast,setToast]=useState("");
  const [save,setSave]=useState("clean");
  const latest=useRef({items,cfg}),fast=useRef(false),block=useRef(false);
  const note=m=>{setToast(m);setTimeout(()=>setToast(""),2800)};
  useEffect(()=>{if(sget("lsfd_saved")==="1"){sset("lsfd_saved","0");setSave("saved");note("✓ Tersimpan permanen untuk semua pengunjung")}},[]);
  const setV=v=>{setView(v);sset("lsfd_view",v)};
  const markI=v=>{setItems(v);setDirty(true)};
  const markC=v=>{setCfg(v);setDirty(true)};
  const publishNow=async()=>{
    setSave("saving");
    try{
      if(!(window.claude&&window.claude.use))throw{code:"nocap"};
      const a=await window.claude.use("artifact");
      if(!a)throw{code:"nocap"};
      sset("lsfd_saved","1");
      await a.publish(buildDoc({rev:REV+1,items:latest.current.items,cfg:latest.current.cfg}));
    }catch(e){
      sset("lsfd_saved","0");
      const c=e&&e.code;
      block.current=(c==="not_writer"||c==="not_granted"||c==="nocap"||c==="capability_disabled"||c==="not_declared"||c==="too_large");
      setSave(c==="not_writer"||c==="not_granted"?"readonly":c==="nocap"||c==="capability_disabled"||c==="not_declared"?"nocap":c==="too_large"?"big":"error");
    }
  };
  useEffect(()=>{
    latest.current={items,cfg};
    if(!dirty||!admin)return;
    try{localStorage.setItem(DKEY,JSON.stringify({baseRev:REV,items,cfg}))}catch(e){}
    if(block.current)return;
    setSave("pending");
    const t=setTimeout(publishNow,fast.current?400:3000);fast.current=false;
    return()=>clearTimeout(t);
  },[items,cfg,dirty,admin]);
  const visible=useMemo(()=>items.filter(a=>admin||!a.draft),[items,admin]);
  const sorted=useMemo(()=>[...visible].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||new Date(b.date)-new Date(a.date)),[visible]);
  const list=sorted.filter(a=>(filter.k==="sec"?a.type===filter.v:filter.k==="div"?(!filter.v||a.division===filter.v):true)&&(!q||(a.title+a.content).toLowerCase().includes(q.toLowerCase())));
  const article=sorted.find(a=>a.id===cur)||list[0]||sorted[0];
  const related=article?sorted.filter(a=>a.id!==article.id&&a.division===article.division).slice(0,3):[];
  const pick=id=>{setCur(id);setForm(null);setV("read");try{history.replaceState(null,"","#"+id)}catch(e){}window.scrollTo({top:0,behavior:"smooth"})};
  const go=f=>{setFilter(f);setCur(null);setForm(null);setV("read");setMenu(false)};
  const save1=f=>{
    fast.current=true;
    if(form&&form.id){markI(items.map(a=>a.id===form.id?{...a,...f}:a));setCur(form.id)}
    else{const a={...f,id:"p"+Date.now()};markI([a,...items]);setCur(a.id)}
    setForm(null);setV("read");
  };
  const del=a=>{if(confirm("Hapus press release ini?")){fast.current=true;markI(items.filter(x=>x.id!==a.id));setCur(null);note("Rilis dihapus.")}};
  const dupe=a=>{fast.current=true;markI([{...a,id:"p"+Date.now(),title:a.title+" (salinan)",draft:true,date:nowLocal()},...items]);note("Disalin sebagai draft.")};
  const pin=a=>{fast.current=true;markI(items.map(x=>x.id===a.id?{...x,pinned:!x.pinned}:x))};
  const reset=()=>{if(confirm("Reset semua postingan & pengaturan ke awal?")){fast.current=true;markI(seed);markC(defCfg);note("Data direset.")}};
  const exp=async()=>{try{const d=await window.claude.use("downloads");if(!d)throw 0;await d.save({filename:"lsfd-pio-backup.json",data:JSON.stringify({items,cfg},null,1)})}catch(e){note("Export tidak tersedia/dibatalkan.")}};
  const imp=async file=>{try{const j=JSON.parse(await file.text());if(!Array.isArray(j.items))throw 0;fast.current=true;markI(j.items);markC(mergeCfg(j.cfg));note("Backup dipulihkan.")}catch(e){note("File backup tidak valid.")}};
  const doLogin=()=>{sset("lsfd_admin","1");setAdmin(true);setLogin(false);setV("dash");const d=readDraft();if(d){setItems(d.items);setCfg(mergeCfg(d.cfg));setDirty(true)}note("Login berhasil. Perubahan akan tersimpan otomatis.")};
  const doLogout=()=>{sset("lsfd_admin","0");setAdmin(false);setV("read");setForm(null)};
  const navActive=s=>s.kind==="divs"?filter.k==="div":(filter.k==="sec"&&filter.v===s.id);
  const click=s=>go(s.kind==="divs"?{k:"div",v:""}:{k:"sec",v:s.id});
  const SV={clean:["","text-slate-700"],pending:["● Perubahan akan disimpan otomatis…","text-amber-900"],saving:["⏳ Menyimpan permanen…","text-amber-900"],saved:["✓ Tersimpan permanen untuk semua pengunjung","text-green-900"],
    readonly:["⚠ Akun ini bukan pemilik halaman. Buka halaman ini saat login di claude.ai agar tersimpan permanen. Sementara tersimpan di browser ini.","text-red-900"],
    nocap:["⚠ Penyimpanan permanen tidak tersedia di tampilan ini (buka lewat link artifact claude.ai). Sementara tersimpan di browser ini.","text-red-900"],
    big:["⚠ Data terlalu besar. Perkecil/kurangi foto lalu coba lagi.","text-red-900"],error:["⚠ Gagal menyimpan. Klik 'Simpan sekarang' untuk coba lagi.","text-red-900"]}[save];
  const bnCol=cfg.banner.level==="alert"?"bg-red-700":"bg-amber-600";
  return <div className="min-h-screen">
    <header className="sans sticky top-0 z-40 shadow-lg" style={{paddingTop:"env(safe-area-inset-top,0px)",background:"#0b1426"}}>
      <div className="h-1 bg-[#c9a227]"></div>
      <div className="max-w-7xl mx-auto px-3 md:px-4 py-2 flex items-center gap-2 md:gap-3">
        <img src={LOGO} alt="LSFD" className="h-12 w-12 md:h-16 md:w-16 cursor-pointer shrink-0" onClick={()=>go({k:"all",v:""})}/>
        <div className="leading-tight mr-auto cursor-pointer min-w-0" onClick={()=>go({k:"all",v:""})}>
          <div className="text-white font-extrabold tracking-wide text-xs sm:text-sm md:text-lg truncate">{cfg.org}</div>
          <div className="text-[#c9a227] text-[9px] sm:text-[10px] md:text-xs font-semibold tracking-[0.15em] md:tracking-[0.2em] truncate">{cfg.sub}</div>
        </div>
        <nav className="hidden xl:flex items-center gap-1">
          {cfg.sections.map(s=><button key={s.id} onClick={()=>click(s)} className={"px-3 py-2 text-sm font-semibold text-white/90 hover:text-[#c9a227] border-b-2 "+(navActive(s)&&view==="read"?"border-[#c9a227]":"border-transparent")}>{s.label}</button>)}
        </nav>
        <button onClick={()=>setSearching(!searching)} className="text-white p-2 hover:text-[#c9a227]" aria-label="Search"><Icon n="Search" size={20}/></button>
        {admin?<div className="flex items-center gap-1 md:gap-2">
          <button onClick={()=>{setV(view==="dash"?"read":"dash");setForm(null)}} className="bg-[#c9a227] text-[#0b1426] text-xs font-bold px-2.5 md:px-3 py-2 rounded flex items-center gap-1"><Icon n="LayoutDashboard" size={14}/><span className="hidden sm:inline">Dashboard</span></button>
          <button onClick={doLogout} className="text-white text-xs border border-white/30 px-2.5 md:px-3 py-2 rounded flex items-center gap-1"><Icon n="LogOut" size={14}/><span className="hidden sm:inline">Logout</span></button>
        </div>:<button onClick={()=>setLogin(true)} className="text-white text-xs font-semibold border border-[#c9a227] px-2.5 md:px-3 py-2 rounded flex items-center gap-1 hover:bg-[#c9a227] hover:text-[#0b1426]"><Icon n="CircleUserRound" size={16}/>Admin<span className="hidden sm:inline"> Login</span></button>}
        <button className="xl:hidden text-white p-2" onClick={()=>setMenu(!menu)} aria-label="Menu"><Icon n={menu?"X":"Menu"} size={22}/></button>
      </div>
      {searching&&<div className="bg-[#101c36] px-4 py-2"><div className="max-w-7xl mx-auto"><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari press release..." className="w-full px-3 py-2 rounded text-sm"/></div></div>}
      {menu&&<div className="xl:hidden bg-[#101c36] px-4 py-2 flex flex-col">{cfg.sections.map(s=><button key={s.id} className="text-left text-white py-3 text-sm border-b border-white/10 last:border-0" onClick={()=>click(s)}>{s.label}</button>)}</div>}
      {filter.k==="div"&&view==="read"&&<div className="bg-[#7a0f14] px-4 py-2"><div className="max-w-7xl mx-auto flex flex-wrap gap-2">
        <button onClick={()=>go({k:"div",v:""})} className={"text-xs px-3 py-1 rounded-full font-semibold "+(!filter.v?"bg-[#c9a227] text-[#0b1426]":"bg-white/10 text-white")}>Semua</button>
        {cfg.divisions.map(d=><button key={d} onClick={()=>{setFilter({k:"div",v:d});setCur(null)}} className={"text-xs px-3 py-1 rounded-full font-semibold "+(filter.v===d?"bg-[#c9a227] text-[#0b1426]":"bg-white/10 text-white")}>{d}</button>)}</div></div>}
    </header>
    {cfg.banner.on&&cfg.banner.text&&<div className={"sans text-white text-sm font-semibold "+bnCol}><div className="max-w-7xl mx-auto px-4 py-2 flex items-center gap-2"><Icon n="Siren" size={16} className="shrink-0"/>{cfg.banner.text}</div></div>}
    {admin&&<div className="sans bg-[#c9a227] text-[#0b1426] shadow"><div className="max-w-7xl mx-auto px-3 md:px-4 py-3 flex flex-wrap items-center gap-2 md:gap-3">
      <b className="text-sm">MODE ADMIN</b>
      <button onClick={()=>{setForm({});setV("read");window.scrollTo({top:0,behavior:"smooth"})}} className="bg-[#7a0f14] text-white px-3 md:px-4 py-2 rounded text-sm font-bold flex items-center gap-2 shadow"><Icon n="Plus" size={16}/>Tambah Postingan Baru</button>
      <button onClick={()=>{setV("dash");setForm(null);window.scrollTo({top:0,behavior:"smooth"})}} className="bg-[#0b1426] text-white px-3 md:px-4 py-2 rounded text-sm font-semibold">Dashboard</button>
      {SV[0]&&<span className={"text-xs font-semibold flex-1 min-w-[12rem] "+SV[1]}>{SV[0]}</span>}
      {dirty&&save!=="saving"&&save!=="saved"&&<button onClick={()=>{block.current=false;publishNow()}} className="text-xs border border-[#0b1426] px-3 py-1.5 rounded font-semibold">Simpan sekarang</button>}
    </div></div>}

    <main className="max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-6 grid lg:grid-cols-3 gap-5 md:gap-6">
      <section className="lg:col-span-2 space-y-4 min-w-0">
        {admin&&view==="dash"&&!form&&<Dashboard items={items} cfg={cfg} setCfg={markC} setItems={v=>{fast.current=true;markI(v)}} note={note} onReset={reset} onNew={()=>setForm({})} onEdit={a=>setForm(a)} onOpen={pick} onExport={exp} onImport={imp} dupe={dupe} pin={pin}/>}
        {admin&&form&&<PostForm init={form.id?form:null} cfg={cfg} onSave={save1} onCancel={()=>setForm(null)}/>}
        {view==="read"&&!form&&(article?<Article a={article} cfg={cfg} admin={admin} onEdit={a=>setForm(a)} onDelete={del} related={related} onPick={pick} note={note}/>:<div className="bg-white p-8 rounded text-center sans text-slate-500">Belum ada press release.</div>)}
      </section>
      <Sidebar list={list} cfg={cfg} cur={article&&article.id} onPick={pick}/>
    </main>

    <footer className="sans bg-[#0b1426] text-slate-300 text-xs mt-8 border-t-4 border-[#c9a227]">
      <div className="max-w-7xl mx-auto px-4 py-6 flex flex-wrap items-center gap-4">
        <img src={LOGO} className="h-12 w-12" alt=""/>
        <div className="flex-1 min-w-[200px]">{cfg.footer}</div>
      </div>
    </footer>
    {admin&&!form&&<button onClick={()=>{setForm({});setV("read");window.scrollTo({top:0,behavior:"smooth"})}} className="sans noprint fixed bottom-5 right-5 z-40 bg-[#7a0f14] text-white px-5 py-3 rounded-full shadow-xl font-bold text-sm border-2 border-[#c9a227]">+ Postingan Baru</button>}
    {login&&<Login onClose={()=>setLogin(false)} onLogin={doLogin}/>}
    {toast&&<div className="sans fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#0b1426] text-white text-sm px-4 py-2 rounded shadow-lg z-50 border border-[#c9a227] max-w-[90vw] text-center">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
