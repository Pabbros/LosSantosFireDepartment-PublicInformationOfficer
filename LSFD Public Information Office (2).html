const Icon=({n,size=18,className=""})=>{
  let d=window.lucide&&window.lucide.icons&&window.lucide.icons[n];
  if(!d)return null;
  if(d[0]==="svg")d=d[2];
  return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{d.map((e,i)=>React.createElement(e[0],{...e[1],key:i}))}</svg>;
};

const seed=[
{id:"s1",type:"incident",tag:"Arson Investigation",division:"Arson Counter Terrorism",status:"Under Investigation",title:"Arson investigation underway in El Corona after suspected deliberate fire",author:"PIO Captain, LSFD Public Relations",date:"2026-10-10T23:10",image:HERO,
content:"EL CORONA, Los Santos – Fire investigators are examining a suspected arson at a residence on Unity Boulevard after evidence suggested the fire may have been deliberately set. The Los Santos Fire Department's Arson Counter Terrorism Section is leading the investigation.\n\nInvestigators deployed a specialized K-9 unit trained to detect accelerants. According to field reports, the canine detected traces consistent with gasoline inside the damaged building. A used jerrycan believed to have been used to spread fuel was also recovered.\n\n\"All physical evidence at the scene points to one conclusion: this was not an accident, but a planned act,\" said Arson Fire Captain Adam Garpen. Debris samples and the suspected fuel container have been sent for forensic testing to identify potential fingerprints or DNA evidence.\n\nThe department urges anyone who witnessed suspicious activity near Unity Boulevard on the night of the incident to contact authorities through the 9-1-1 emergency hotline. Informant identities will remain confidential."},
{id:"s2",type:"advisory",tag:"Public Safety",division:"Fire Suppression",status:"Active Advisory",title:"Brush fire season: LSFD issues Red Flag guidance for Blueberry and Red County",author:"PIO Lieutenant, LSFD Public Relations",date:"2026-10-09T09:30",image:"",
content:"LOS SANTOS – With dry conditions and seasonal winds forecast through the week, the Los Santos Fire Department has issued a Red Flag advisory for Blueberry and Red County.\n\nResidents are asked to avoid open flames, refrain from using power equipment on dry vegetation, and maintain at least 30 feet of defensible space around structures.\n\nAny sign of smoke or fire should be reported immediately to 9-1-1. Do not attempt to fight a wildland fire yourself."},
{id:"s3",type:"press",tag:"Public Health",division:"EMS",status:"Community",title:"LSFD EMS opens free CPR and AED training sessions across the city",author:"PIO Captain, LSFD Public Relations",date:"2026-10-08T14:00",image:"",
content:"LOS SANTOS – The LSFD Emergency Medical Services Division will host free hands-only CPR and AED training sessions at city fire stations beginning next week.\n\nCertified paramedics will guide participants through recognizing cardiac arrest, performing compressions, and operating automated external defibrillators. No registration is required and sessions are open to all residents aged 12 and older.\n\n\"Bystander action in the first minutes saves lives,\" the division said in a statement."},
{id:"s4",type:"incident",tag:"Structure Fire",division:"Fire Suppression",status:"Resolved",title:"Two-alarm structure fire at Davis warehouse contained, no injuries reported",author:"PIO Lieutenant, LSFD Public Relations",date:"2026-10-07T03:45",image:"",
content:"DAVIS, Los Santos – Firefighters contained a two-alarm fire at a commercial warehouse in Davis early Wednesday. Crews arrived within minutes and mounted an aggressive interior and exterior attack.\n\nNo civilians or firefighters were injured. The cause is under investigation and the building has been turned over to the property owner."},
{id:"s5",type:"bulletin",tag:"Hazardous Materials",division:"HAZMAT",status:"Closed",title:"HAZMAT team neutralizes chemical leak at Terminal Island facility",author:"PIO Captain, LSFD Public Relations",date:"2026-10-05T18:20",image:"",
content:"TERMINAL ISLAND, Los Santos – The LSFD HAZMAT Division responded to a reported chemical leak at an industrial facility. Nearby streets were briefly closed as a precaution.\n\nThe substance was contained and neutralized. Air monitoring showed no ongoing risk to the public, and all roads have reopened."}
];
const ld=(k,d)=>{try{const r=localStorage.getItem(k);if(r){const p=JSON.parse(r);if(p)return p}}catch(e){}return d};
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fmt=d=>new Date(d).toLocaleString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
const fmtS=d=>new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const readImg=file=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/im.width);const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(file)});
const I="w-full border rounded px-3 py-2 text-sm bg-white";

function Thumb({a,cls=""}){
  const [bad,setBad]=useState(false);
  if(a.image&&!bad)return <img src={a.image} alt="" onError={()=>setBad(true)} className={"object-cover "+cls}/>;
  return <div className={"flex items-center justify-center text-white/90 "+cls} style={{background:"linear-gradient(135deg,#0b1426,#7a0f14)"}}><Icon n={DICON[a.division]||"Flame"} size={28}/></div>;
}

function Login({onClose,onLogin}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[e,setE]=useState("");
  const go=()=>{u==="admin"&&p==="admin"?onLogin():setE("Username atau password salah.")};
  return <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 sans" onClick={onClose}>
    <div className="bg-white w-full max-w-sm rounded shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
      <div className="bg-[#0b1426] border-b-4 border-[#c9a227] p-5 text-center">
        <img src={LOGO} className="h-16 w-16 mx-auto mb-2" alt="LSFD"/>
        <div className="text-white font-bold tracking-wide">PIO Admin Login</div>
        <div className="text-[#c9a227] text-xs tracking-widest">AUTHORIZED PERSONNEL ONLY</div>
      </div>
      <div className="p-5 space-y-3">
        <input autoFocus className={I} placeholder="Username" value={u} onChange={e=>setU(e.target.value)}/>
        <input className={I} type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/>
        {e&&<div className="text-red-700 text-sm">{e}</div>}
        <button onClick={go} className="w-full bg-[#7a0f14] hover:bg-[#5e0b10] text-white font-semibold py-2 rounded">Login</button>
        <button onClick={onClose} className="w-full text-sm text-slate-500">Batal</button>
      </div>
    </div>
  </div>;
}

function PostForm({init,cfg,onSave,onCancel}){
  const secs=cfg.sections.filter(s=>s.kind==="sec");
  const [f,setF]=useState(init||{title:"",author:"",division:cfg.divisions[0]||"",type:secs[0]?secs[0].id:"",tag:"",status:"Published",image:"",date:nowLocal(),content:""});
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const ok=f.title.trim()&&f.content.trim();
  return <div className="bg-white border-t-4 border-[#c9a227] rounded shadow p-5 sans space-y-3">
    <h3 className="font-bold text-lg text-[#0b1426] flex items-center gap-2"><Icon n="FilePlus2" size={18}/>{init?"Edit Press Release":"Publish New Press Release"}</h3>
    <input className={I} placeholder="Judul rilis" value={f.title} onChange={set("title")}/>
    <input className={I} placeholder="Nama PIO Officer / Rank" value={f.author} onChange={set("author")}/>
    <div className="grid sm:grid-cols-2 gap-3">
      <select className={I} value={f.division} onChange={set("division")}>{cfg.divisions.map(d=><option key={d}>{d}</option>)}</select>
      <select className={I} value={f.type} onChange={set("type")}>{secs.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select>
      <input className={I} placeholder="Tag kategori (mis. Structure Fire)" value={f.tag} onChange={set("tag")}/>
      <input className={I} placeholder="Badge status (mis. Resolved)" value={f.status} onChange={set("status")}/>
    </div>
    <label className="block text-xs text-slate-500">Tanggal & waktu terbit<input type="datetime-local" className={I} value={f.date} onChange={set("date")}/></label>
    <div className="flex gap-2 items-center">
      <input className={I} placeholder="URL gambar utama (atau upload →)" value={f.image.startsWith("data:")?"(gambar ter-upload)":f.image} onChange={set("image")}/>
      <label className="shrink-0 px-3 py-2 text-sm border rounded cursor-pointer bg-slate-50">Upload<input type="file" accept="image/*" className="hidden" onChange={async e=>{const x=e.target.files[0];if(x)setF({...f,image:await readImg(x)})}}/></label>
      {f.image&&<button className="text-xs text-red-700" onClick={()=>setF({...f,image:""})}>Hapus</button>}
    </div>
    {f.image&&<Thumb a={f} cls="h-28 rounded"/>}
    <textarea className={I} rows={10} placeholder="Isi rilis lengkap. Pisahkan paragraf dengan baris kosong." value={f.content} onChange={set("content")}/>
    <div className="flex gap-2 justify-end">
      <button onClick={onCancel} className="px-4 py-2 text-sm border rounded">Batal</button>
      <button disabled={!ok} onClick={()=>onSave(f)} className="px-4 py-2 text-sm bg-[#7a0f14] disabled:opacity-40 text-white rounded flex items-center gap-2"><Icon n="Send" size={14}/>{init?"Simpan":"Publish"}</button>
    </div>
  </div>;
}

function Dashboard({items,cfg,setCfg,setItems,onEdit,onNew,onOpen,onReset,note}){
  const [tab,setTab]=useState("posts");
  const [ns,setNs]=useState(""),[nd,setNd]=useState("");
  const T=(k,l,ic)=><button onClick={()=>setTab(k)} className={"px-4 py-2 text-sm font-semibold flex items-center gap-1 border-b-2 "+(tab===k?"border-[#7a0f14] text-[#7a0f14]":"border-transparent text-slate-500")}><Icon n={ic} size={14}/>{l}</button>;
  const c=(k,v)=>setCfg({...cfg,[k]:v});
  const dsp=(k,v)=>setCfg({...cfg,dispatch:{...cfg.dispatch,[k]:v}});
  const mv=(i,d)=>{const s=[...cfg.sections];const j=i+d;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];c("sections",s)};
  const fld=(l,v,fn,rows)=><label className="block text-xs text-slate-500">{l}{rows?<textarea rows={rows} className={I} value={v} onChange={e=>fn(e.target.value)}/>:<input className={I} value={v} onChange={e=>fn(e.target.value)}/>}</label>;
  return <div className="bg-white rounded shadow border-t-4 border-[#c9a227] sans">
    <div className="px-5 pt-4"><h2 className="font-bold text-xl text-[#0b1426] flex items-center gap-2"><Icon n="LayoutDashboard" size={20}/>PIO Command Dashboard / CMS</h2>
      <div className="flex flex-wrap border-b mt-2">{T("posts","Postingan","Newspaper")}{T("menu","Menu & Kategori","ListTree")}{T("site","Pengaturan Situs","Settings")}</div></div>
    <div className="p-5 space-y-4">
    {tab==="posts"&&<>
      <button onClick={onNew} className="bg-[#7a0f14] text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-2"><Icon n="Plus" size={14}/>Tambah Press Release</button>
      <div className="divide-y border rounded">{[...items].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(a=><div key={a.id} className="p-3 flex items-center gap-3">
        <Thumb a={a} cls="w-14 h-12 rounded shrink-0"/>
        <div className="flex-1 min-w-0"><button onClick={()=>onOpen(a.id)} className="text-sm font-semibold text-left hover:underline line-clamp-2">{a.title}</button><div className="text-xs text-slate-500">{fmtS(a.date)} · {(cfg.sections.find(s=>s.id===a.type)||{}).label||"—"} · {a.division}</div></div>
        <button onClick={()=>onEdit(a)} className="p-2 border rounded" title="Edit"><Icon n="Pencil" size={14}/></button>
        <button onClick={()=>{if(confirm("Hapus rilis ini?")){setItems(items.filter(x=>x.id!==a.id));note("Rilis dihapus.")}}} className="p-2 border border-red-300 text-red-700 rounded" title="Hapus"><Icon n="Trash2" size={14}/></button>
      </div>)}{items.length===0&&<div className="p-4 text-sm text-slate-500">Belum ada postingan.</div>}</div>
    </>}
    {tab==="menu"&&<>
      <div>
        <div className="font-bold text-sm mb-2">Menu navigasi (urut & ganti nama)</div>
        {cfg.sections.map((s,i)=><div key={s.id} className="flex items-center gap-2 mb-2">
          <input className={I} value={s.label} onChange={e=>c("sections",cfg.sections.map(x=>x.id===s.id?{...x,label:e.target.value}:x))}/>
          <span className="text-[10px] uppercase text-slate-400 w-14 shrink-0">{s.kind==="divs"?"divisi":"kategori"}</span>
          <button onClick={()=>mv(i,-1)} className="p-2 border rounded"><Icon n="ArrowUp" size={13}/></button>
          <button onClick={()=>mv(i,1)} className="p-2 border rounded"><Icon n="ArrowDown" size={13}/></button>
          <button onClick={()=>{if(confirm("Hapus menu ini? Postingan tidak ikut terhapus."))c("sections",cfg.sections.filter(x=>x.id!==s.id))}} className="p-2 border border-red-300 text-red-700 rounded"><Icon n="Trash2" size={13}/></button>
        </div>)}
        <div className="flex gap-2"><input className={I} placeholder="Menu/kategori baru (mis. Community Events)" value={ns} onChange={e=>setNs(e.target.value)}/>
        <button onClick={()=>{if(ns.trim()){c("sections",[...cfg.sections,{id:"c"+Date.now(),label:ns.trim(),kind:"sec"}]);setNs("")}}} className="px-3 bg-[#0b1426] text-white rounded text-sm shrink-0">Tambah</button></div>
      </div>
      <div>
        <div className="font-bold text-sm mb-2">Divisi</div>
        {cfg.divisions.map((d,i)=><div key={i} className="flex gap-2 mb-2"><input className={I} value={d} onChange={e=>{const r=items.map(a=>a.division===d?{...a,division:e.target.value}:a);setItems(r);c("divisions",cfg.divisions.map((x,j)=>j===i?e.target.value:x))}}/>
          <button onClick={()=>c("divisions",cfg.divisions.filter((_,j)=>j!==i))} className="p-2 border border-red-300 text-red-700 rounded"><Icon n="Trash2" size={13}/></button></div>)}
        <div className="flex gap-2"><input className={I} placeholder="Divisi baru" value={nd} onChange={e=>setNd(e.target.value)}/>
        <button onClick={()=>{if(nd.trim()){c("divisions",[...cfg.divisions,nd.trim()]);setNd("")}}} className="px-3 bg-[#0b1426] text-white rounded text-sm shrink-0">Tambah</button></div>
      </div>
    </>}
    {tab==="site"&&<div className="space-y-3">
      {fld("Nama instansi (header)",cfg.org,v=>c("org",v))}
      {fld("Sub-judul header",cfg.sub,v=>c("sub",v))}
      {fld("Judul daftar sidebar",cfg.listTitle,v=>c("listTitle",v))}
      <div className="font-bold text-sm pt-2">Widget Live Dispatch / Emergency Alerts</div>
      {fld("Judul widget",cfg.dispatch.title,v=>dsp("title",v))}
      <div className="grid grid-cols-3 gap-2">{fld("Active",cfg.dispatch.active,v=>dsp("active",v))}{fld("Units Avail.",cfg.dispatch.units,v=>dsp("units",v))}{fld("Response",cfg.dispatch.response,v=>dsp("response",v))}</div>
      {fld("Teks alert",cfg.dispatch.alert,v=>dsp("alert",v))}
      {fld("Teks kontak darurat",cfg.dispatch.phone,v=>dsp("phone",v))}
      {fld("Official disclaimer (bawah artikel)",cfg.disclaimer,v=>c("disclaimer",v),4)}
      {fld("Teks footer",cfg.footer,v=>c("footer",v),3)}
      <button onClick={onReset} className="text-sm border border-red-300 text-red-700 px-3 py-2 rounded flex items-center gap-2"><Icon n="RotateCcw" size={14}/>Reset semua data ke awal</button>
    </div>}
    <div className="text-xs text-slate-400">Perubahan tersimpan otomatis di browser ini.</div>
    </div>
  </div>;
}

function Article({a,cfg,admin,onEdit,onDelete}){
  const sec=cfg.sections.find(s=>s.id===a.type);
  return <article className="bg-white rounded shadow-sm border">
    <div className="p-5 md:p-7">
      <div className="flex flex-wrap items-center gap-2 sans text-xs font-bold uppercase tracking-wider">
        {(a.tag||sec)&&<span className="bg-[#7a0f14] text-white px-2 py-1 rounded-sm">{a.tag||sec.label}</span>}
        <span className={"text-white px-2 py-1 rounded-sm "+PAL[Math.max(0,cfg.divisions.indexOf(a.division))%PAL.length]}>{a.division}</span>
        {sec&&<span className="text-slate-500">{sec.label}</span>}
      </div>
      <h1 className="text-2xl md:text-4xl font-bold leading-tight mt-3 text-[#0b1426]">{a.title}</h1>
      <div className="sans text-sm text-slate-600 mt-3 flex flex-wrap items-center gap-x-4 gap-y-1">
        {a.author&&<span className="flex items-center gap-1"><Icon n="UserRound" size={14}/>By {a.author}</span>}
        <span className="flex items-center gap-1"><Icon n="Clock" size={14}/>{fmt(a.date)}</span>
      </div>
      {admin&&<div className="sans mt-3 flex gap-2">
        <button onClick={()=>onEdit(a)} className="text-xs border px-3 py-1 rounded flex items-center gap-1"><Icon n="Pencil" size={12}/>Edit</button>
        <button onClick={()=>onDelete(a)} className="text-xs border border-red-300 text-red-700 px-3 py-1 rounded flex items-center gap-1"><Icon n="Trash2" size={12}/>Hapus</button>
      </div>}
    </div>
    <Thumb a={a} cls="w-full h-64 md:h-[26rem]"/>
    <div className="sans text-xs text-slate-500 px-5 md:px-7 py-2 border-b italic">Official LSFD photo/graphic – Los Santos Fire Department Public Information Office</div>
    <div className="p-5 md:p-7 relative overflow-hidden">
      <img src={LOGO} alt="" className="absolute right-4 bottom-4 w-56 opacity-[0.05] pointer-events-none"/>
      {a.content.split(/\n\s*\n/).map((p,i)=><p key={i} className="prose-p relative">{p}</p>)}
      <div className="sans mt-6 border-l-4 border-[#c9a227] bg-[#f8f5ea] p-4 text-xs text-slate-700 relative">
        <div className="font-bold text-[#0b1426] mb-1 flex items-center gap-1"><Icon n="BadgeCheck" size={14}/>OFFICIAL DISCLAIMER</div>{cfg.disclaimer}
      </div>
    </div>
  </article>;
}

function Sidebar({list,cur,onPick,cfg}){
  const [t,setT]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
  const d=cfg.dispatch;
  return <aside className="space-y-5 sans">
    <div className="bg-[#0b1426] text-white rounded shadow overflow-hidden">
      <div className="bg-[#7a0f14] px-4 py-2 flex items-center justify-between text-xs font-bold tracking-widest">
        <span className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-red-300 blink"></span>{d.title}</span><span>{t.toLocaleTimeString("en-US",{hour12:false})}</span>
      </div>
      <div className="p-4 grid grid-cols-3 gap-2 text-center">
        {[["Active",d.active],["Units Avail.",d.units],["Response",d.response]].map(([k,v])=><div key={k} className="bg-white/5 rounded py-2"><div className="text-xl font-bold text-[#c9a227]">{v}</div><div className="text-[10px] uppercase tracking-wider text-slate-300">{k}</div></div>)}
      </div>
      <div className="px-4 pb-4 text-xs space-y-1 text-slate-200">
        {d.alert&&<div className="flex items-center gap-2"><Icon n="TriangleAlert" size={13} className="text-amber-400"/>{d.alert}</div>}
        {d.phone&&<div className="flex items-center gap-2"><Icon n="Phone" size={13} className="text-[#c9a227]"/>{d.phone}</div>}
      </div>
    </div>
    <div className="bg-white rounded shadow-sm border">
      <div className="px-4 py-3 border-b-2 border-[#c9a227] font-bold text-[#0b1426] flex items-center gap-2"><Icon n="Newspaper" size={16}/>{cfg.listTitle}</div>
      {list.length===0&&<div className="p-4 text-sm text-slate-500">Belum ada rilis di bagian ini.</div>}
      {list.map(a=><button key={a.id} onClick={()=>onPick(a.id)} className={"w-full text-left flex gap-3 p-3 border-b last:border-0 hover:bg-slate-50 "+(cur===a.id?"bg-[#fbf3f3] border-l-4 border-l-[#7a0f14]":"")}>
        <Thumb a={a} cls="w-20 h-16 rounded shrink-0"/>
        <div className="min-w-0">
          <div className="text-sm font-semibold leading-snug text-[#0b1426] line-clamp-3">{a.title}</div>
          <div className="text-[11px] text-slate-500 mt-1">{fmtS(a.date)}</div>
          <span className={"inline-block mt-1 text-[10px] text-white px-1.5 py-0.5 rounded-sm "+PAL[Math.max(0,cfg.divisions.indexOf(a.division))%PAL.length]}>{a.status||a.division}</span>
        </div>
      </button>)}
    </div>
  </aside>;
}

function App(){
  const [items,setItems]=useState(()=>ld("lsfd_items_v2",seed));
  const [cfg,setCfg]=useState(()=>ld("lsfd_cfg_v2",defCfg));
  const [cur,setCur]=useState(null);
  const [admin,setAdmin]=useState(false);
  const [login,setLogin]=useState(false);
  const [filter,setFilter]=useState({k:"all",v:""});
  const [view,setView]=useState("read");
  const [form,setForm]=useState(null);
  const [q,setQ]=useState(""),[searching,setSearching]=useState(false);
  const [menu,setMenu]=useState(false);
  const [toast,setToast]=useState("");
  useEffect(()=>{try{localStorage.setItem("lsfd_items_v2",JSON.stringify(items))}catch(e){}},[items]);
  useEffect(()=>{try{localStorage.setItem("lsfd_cfg_v2",JSON.stringify(cfg))}catch(e){}},[cfg]);
  const note=m=>{setToast(m);setTimeout(()=>setToast(""),2500)};
  const sorted=useMemo(()=>[...items].sort((a,b)=>new Date(b.date)-new Date(a.date)),[items]);
  const list=sorted.filter(a=>(filter.k==="sec"?a.type===filter.v:filter.k==="div"?(!filter.v||a.division===filter.v):true)&&(!q||(a.title+a.content).toLowerCase().includes(q.toLowerCase())));
  const article=sorted.find(a=>a.id===cur)||list[0];
  const go=f=>{setFilter(f);setCur(null);setForm(null);setView("read");setMenu(false)};
  const save=f=>{
    if(form&&form.id){setItems(items.map(a=>a.id===form.id?{...a,...f}:a));note("Perubahan disimpan.");setCur(form.id)}
    else{const a={...f,id:"p"+Date.now()};setItems([a,...items]);setCur(a.id);note("Press release dipublikasikan.")}
    setForm(null);setView("read");
  };
  const del=a=>{if(confirm("Hapus press release ini?")){setItems(items.filter(x=>x.id!==a.id));setCur(null);note("Rilis dihapus.")}};
  const reset=()=>{if(confirm("Reset semua postingan & pengaturan?")){setItems(seed);setCfg(defCfg);note("Data direset.")}};
  const navActive=s=>s.kind==="divs"?filter.k==="div":(filter.k==="sec"&&filter.v===s.id);
  const click=s=>go(s.kind==="divs"?{k:"div",v:""}:{k:"sec",v:s.id});
  return <div className="min-h-screen">
    <header className="sans sticky top-0 z-40 shadow-lg" style={{paddingTop:"env(safe-area-inset-top,0px)",background:"#0b1426"}}>
      <div className="h-1 bg-[#c9a227]"></div>
      <div className="max-w-7xl mx-auto px-4 py-2 flex items-center gap-3">
        <img src={LOGO} alt="LSFD" className="h-14 w-14 md:h-16 md:w-16 cursor-pointer" onClick={()=>go({k:"all",v:""})}/>
        <div className="leading-tight mr-auto cursor-pointer" onClick={()=>go({k:"all",v:""})}>
          <div className="text-white font-extrabold tracking-wide text-sm md:text-lg">{cfg.org}</div>
          <div className="text-[#c9a227] text-[10px] md:text-xs font-semibold tracking-[0.2em]">{cfg.sub}</div>
        </div>
        <nav className="hidden lg:flex items-center gap-1">
          {cfg.sections.map(s=><button key={s.id} onClick={()=>click(s)} className={"px-3 py-2 text-sm font-semibold text-white/90 hover:text-[#c9a227] border-b-2 "+(navActive(s)&&view==="read"?"border-[#c9a227]":"border-transparent")}>{s.label}</button>)}
        </nav>
        <button onClick={()=>setSearching(!searching)} className="text-white p-2 hover:text-[#c9a227]" aria-label="Search">{window.lucide?<Icon n="Search" size={20}/>:"Cari"}</button>
        {admin?<div className="flex items-center gap-2">
          <button onClick={()=>{setView(view==="dash"?"read":"dash");setForm(null)}} className="bg-[#c9a227] text-[#0b1426] text-xs font-bold px-3 py-2 rounded flex items-center gap-1"><Icon n="LayoutDashboard" size={14}/>Dashboard</button>
          <button onClick={()=>{setAdmin(false);setView("read");setForm(null)}} className="text-white text-xs border border-white/30 px-3 py-2 rounded flex items-center gap-1"><Icon n="LogOut" size={14}/>Logout</button>
        </div>:<button onClick={()=>setLogin(true)} className="text-white text-xs font-semibold border border-[#c9a227] px-3 py-2 rounded flex items-center gap-1 hover:bg-[#c9a227] hover:text-[#0b1426]"><Icon n="CircleUserRound" size={16}/>Admin Login</button>}
        <button className="lg:hidden text-white p-2" onClick={()=>setMenu(!menu)}><Icon n={menu?"X":"Menu"} size={22}/></button>
      </div>
      {searching&&<div className="bg-[#101c36] px-4 py-2"><div className="max-w-7xl mx-auto"><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari press release..." className="w-full px-3 py-2 rounded text-sm"/></div></div>}
      {menu&&<div className="lg:hidden bg-[#101c36] px-4 py-2 flex flex-col">{cfg.sections.map(s=><button key={s.id} className="text-left text-white py-2 text-sm" onClick={()=>click(s)}>{s.label}</button>)}</div>}
      {filter.k==="div"&&view==="read"&&<div className="bg-[#7a0f14] px-4 py-2"><div className="max-w-7xl mx-auto flex flex-wrap gap-2">
        <button onClick={()=>go({k:"div",v:""})} className={"text-xs px-3 py-1 rounded-full font-semibold "+(!filter.v?"bg-[#c9a227] text-[#0b1426]":"bg-white/10 text-white")}>Semua</button>
        {cfg.divisions.map(d=><button key={d} onClick={()=>{setFilter({k:"div",v:d});setCur(null)}} className={"text-xs px-3 py-1 rounded-full font-semibold "+(filter.v===d?"bg-[#c9a227] text-[#0b1426]":"bg-white/10 text-white")}>{d}</button>)}</div></div>}
    </header>
    {admin&&<div className="sans bg-[#c9a227] text-[#0b1426] shadow"><div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <b className="text-sm">MODE ADMIN AKTIF</b>
      <button onClick={()=>{setForm({});setView("read");window.scrollTo({top:0,behavior:"smooth"})}} className="bg-[#7a0f14] text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-2 shadow"><Icon n="Plus" size={16}/>+ Tambah Postingan Baru</button>
      <button onClick={()=>{setView("dash");setForm(null);window.scrollTo({top:0,behavior:"smooth"})}} className="bg-[#0b1426] text-white px-4 py-2 rounded text-sm font-semibold">Dashboard: Postingan, Menu &amp; Pengaturan</button>
      <span className="text-xs hidden md:inline">Edit/Hapus ada di setiap artikel. Semua bisa diubah tanpa menyentuh kode.</span>
    </div></div>}

    <main className="max-w-7xl mx-auto px-4 py-6 grid lg:grid-cols-3 gap-6">
      <section className="lg:col-span-2 space-y-4">
        {admin&&view==="dash"&&!form&&<Dashboard items={items} cfg={cfg} setCfg={setCfg} setItems={setItems} note={note} onReset={reset} onNew={()=>setForm({})} onEdit={a=>setForm(a)} onOpen={id=>{setCur(id);setView("read")}}/>}
        {admin&&form&&<PostForm init={form.id?form:null} cfg={cfg} onSave={save} onCancel={()=>setForm(null)}/>}
        {admin&&view==="read"&&!form&&<button onClick={()=>setForm({})} className="sans bg-[#7a0f14] text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-2"><Icon n="Plus" size={14}/>Tambah Press Release</button>}
        {view==="read"&&!form&&(article?<Article a={article} cfg={cfg} admin={admin} onEdit={a=>setForm(a)} onDelete={del}/>:<div className="bg-white p-8 rounded text-center sans text-slate-500">Belum ada press release.</div>)}
      </section>
      <Sidebar list={list} cfg={cfg} cur={article&&article.id} onPick={id=>{setCur(id);setForm(null);setView("read");window.scrollTo({top:0,behavior:"smooth"})}}/>
    </main>

    <footer className="sans bg-[#0b1426] text-slate-300 text-xs mt-8 border-t-4 border-[#c9a227]">
      <div className="max-w-7xl mx-auto px-4 py-6 flex flex-wrap items-center gap-4">
        <img src={LOGO} className="h-12 w-12" alt=""/>
        <div className="flex-1 min-w-[200px]">{cfg.footer}</div>
      </div>
    </footer>
    {admin&&!form&&<button onClick={()=>{setForm({});setView("read");window.scrollTo({top:0,behavior:"smooth"})}} className="sans fixed bottom-5 right-5 z-40 bg-[#7a0f14] text-white px-5 py-3 rounded-full shadow-xl font-bold text-sm border-2 border-[#c9a227]">+ Postingan Baru</button>}
    {login&&<Login onClose={()=>setLogin(false)} onLogin={()=>{setAdmin(true);setLogin(false);setView("dash");note("Login berhasil. Selamat datang, PIO Director.")}}/>}
    {toast&&<div className="sans fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#0b1426] text-white text-sm px-4 py-2 rounded shadow-lg z-50 border border-[#c9a227]">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
